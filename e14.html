<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ex14</title>
    <link rel="stylesheet" href="e14.css">
</head>
<body>

<h2>Drag and Drop</h2>

<div class="container">

    <div id="zone1" class="zone">
        <h3>Zone 1</h3>

        <div id="element" draggable="true">
            Élément 1
        </div>
    </div>

    <div id="zone2" class="zone">
        <h3>Zone 2</h3>
    </div>

</div>
<style>
    body {
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 30px;
}

.zone {
    width: 250px;
    height: 200px;
    border: 2px dashed blue;
    padding: 15px;
    border-radius: 10px;
}

#element {
    background-color: royalblue;
    color: white;
    padding: 20px;
    cursor: grab;
    border-radius: 8px;
}
</style>

<script src="e14.js"></script>
</body>
</html>
